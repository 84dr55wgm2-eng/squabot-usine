# Regarde des posts X avant d'écrire dessus : planches d'images minutées + paroles, rangées dans les données privées.
name: Regarder des posts X
on:
  workflow_dispatch:
    inputs:
      urls: {description: "Liens des posts, séparés par des espaces", required: true}
permissions:
  contents: read
jobs:
  regarder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SQUABOT_DONNEES: donnees
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 84dr55wgm2-eng/squabot
          token: ${{ secrets.SQUABOT_TOKEN }}
          path: donnees
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-small-v1}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pip install -q -r requirements.txt
      - name: Regarder
        env: {URLS: "${{ inputs.urls }}"}
        run: python -m squabot x regarder $URLS
      - name: Enregistrer dans les données privées
        run: |
          cd donnees
          git config user.name squabot && git config user.email squabot@users.noreply.github.com
          git add -A data/x/vus && git diff --cached --quiet && exit 0
          git commit -m "Posts regardés [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 5)); done
          exit 1

name: Catalogue des voix
# Génère un extrait audio par voix (voix/extraits) et le catalogue (voix/catalogue.json).
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install edge-tts==7.3.1 && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python -m squabot.catalogue_voix
      - name: Enregistrer
        run: |
          git config user.name squabot && git config user.email squabot@users.noreply.github.com
          git add voix && git diff --cached --quiet && exit 0
          git commit -m "Catalogue des voix [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done; exit 1

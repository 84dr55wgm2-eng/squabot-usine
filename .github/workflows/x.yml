# Veille 𝕏 : lit les comptes suivis (sources/x.yaml des données privées), note les posts, garde l'index.
# Les médias ne sont pas publiés ici : ils sont téléchargés au moment du montage.
name: Veille X
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: read
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SQUABOT_DONNEES: donnees
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 84dr55wgm2-eng/squabot
          token: ${{ secrets.SQUABOT_TOKEN }}
          path: donnees
      - uses: actions/cache@v4
        with: {path: /home/runner/.cache/fastembed, key: fastembed-v1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -q PyYAML gallery-dl==1.32.21 fastembed==0.9.1
      - name: Lire les comptes
        run: python -m squabot x suivre
      - name: Enregistrer dans les données privées
        run: |
          cd donnees
          git config user.name squabot && git config user.email squabot@users.noreply.github.com
          git add -A data/x && git diff --cached --quiet && exit 0
          git commit -m "Veille X [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 5)); done
          exit 1

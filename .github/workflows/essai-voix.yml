name: Comparatif des voix
on:
  workflow_dispatch:
    inputs:
      moteurs: {description: "Moteurs (JSON)", default: '["voxcpm","supertonic","gemini","edge"]', type: string}
permissions: {contents: write}
jobs:
  voix:
    strategy:
      fail-fast: false
      matrix:
        moteur: ${{ fromJSON(inputs.moteurs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Outils
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          case "${{ matrix.moteur }}" in
            voxcpm) pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install voxcpm soundfile ;;
            supertonic) pip install supertonic soundfile numpy ;;
            edge) pip install edge-tts==7.3.1 ;;
            gemini) [ -n "$GEMINI_API_KEY" ] || { echo "Pas de clé GEMINI_API_KEY : moteur sauté."; exit 0; } ;;
          esac
      - name: Voix
        run: |
          if [ "${{ matrix.moteur }}" = gemini ] && [ -z "$GEMINI_API_KEY" ]; then exit 0; fi
          python -m squabot.essai_voix ${{ matrix.moteur }}
      - name: Enregistrer
        run: |
          git config user.name squabot && git config user.email squabot@users.noreply.github.com
          mkdir -p voix/essais; git add -A voix/essais; git diff --cached --quiet && exit 0
          git commit -m "Essai de voix : ${{ matrix.moteur }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep $((i * 7)); done; exit 1

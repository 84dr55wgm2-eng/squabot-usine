# Quels comptes sont branchés (noms des secrets et autorisations chiffrées présents, jamais leurs valeurs).
name: État des connexions
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"
permissions:
  contents: write
  actions: write
jobs:
  cle:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env: {T: "${{ secrets.SQUABOT_TOKEN }}"}
        run: |
          if [ -z "$T" ]; then echo "Clé SQUABOT_TOKEN absente : rien à faire tant qu'elle n'est pas ajoutée (Settings → Secrets → Actions)."; echo "ok=non" >> $GITHUB_OUTPUT; else echo "ok=oui" >> $GITHUB_OUTPUT; fi
  etat:
    needs: cle
    if: needs.cle.outputs.ok == 'oui'
    runs-on: ubuntu-latest
    env:
      SQUABOT_DONNEES: donnees
      SQUABOT_DEPOT_DONNEES: 84dr55wgm2-eng/squabot
    steps:
      - uses: actions/checkout@v4
      - name: Données privées
        uses: actions/checkout@v4
        with:
          repository: 84dr55wgm2-eng/squabot
          token: ${{ secrets.SQUABOT_TOKEN }}
          path: donnees
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - name: Outils
        run: |
          pip install PyYAML==6.0.3 cryptography==50.0.1
      - name: Noms des secrets présents
        env: {TOUS: "${{ toJSON(secrets) }}"}
        run: |
          python -c "import json,os,datetime as d;n=sorted(k for k in json.loads(os.environ['TOUS']) if k not in ('github_token','SQUABOT_TOKEN'));json.dump({'maj':d.datetime.utcnow().isoformat(timespec='minutes')+'Z','secrets':n},open('donnees/data/connexions.json','w'),indent=1);print(n)"
          python -m squabot index
      - name: Enregistrer dans les données privées
        run: |
          cd donnees
          git config user.name squabot && git config user.email squabot@users.noreply.github.com
          git add -A data tableau comptes 2>/dev/null || git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "État des connexions [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 5)); done
          exit 1

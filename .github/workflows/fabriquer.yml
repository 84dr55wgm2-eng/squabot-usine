# Fabrique les vidéos « a_fabriquer » des données privées, en parallèle (une machine par vidéo).
# Toutes les 30 min, ou relancée par la tournée. Entrée « seul » : une seule vidéo.
name: Fabriquer les vidéos
on:
  workflow_dispatch:
    inputs:
      seul:
        description: "Identifiant d'une seule vidéo"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: fabrication-${{ inputs.seul }}
  cancel-in-progress: false
jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.l.outputs.ids }}
    steps:
      - id: cle
        env: {T: "${{ secrets.SQUABOT_TOKEN }}"}
        run: if [ -z "$T" ]; then echo "Clé SQUABOT_TOKEN absente."; echo "ok=non" >> $GITHUB_OUTPUT; else echo "ok=oui" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.cle.outputs.ok == 'oui'
      - uses: actions/checkout@v4
        if: steps.cle.outputs.ok == 'oui'
        with:
          repository: 84dr55wgm2-eng/squabot
          token: ${{ secrets.SQUABOT_TOKEN }}
          path: donnees
      - id: l
        if: steps.cle.outputs.ok == 'oui'
        env: {SEUL: "${{ inputs.seul }}"}
        run: |
          pip install -q PyYAML==6.0.3
          ids=$(SQUABOT_DONNEES=donnees python -c "
          import json, glob, os
          s = os.environ.get('SEUL')
          l = [json.load(open(f)) for f in sorted(glob.glob('donnees/data/videos/*/video.json'))]
          l = [v['id'] for v in l if v.get('statut') == 'a_fabriquer' and (not s or v['id'] == s)]
          print(json.dumps(l[:10]))")
          echo "ids=$ids" >> $GITHUB_OUTPUT; echo "À fabriquer : $ids"
  fabriquer:
    needs: liste
    if: needs.liste.outputs.ids != '' && needs.liste.outputs.ids != '[]'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        id: ${{ fromJSON(needs.liste.outputs.ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: video-${{ matrix.id }}
      cancel-in-progress: false
    env:
      SQUABOT_DONNEES: donnees
      SQUABOT_DEPOT_DONNEES: 84dr55wgm2-eng/squabot
    steps:
      - uses: actions/checkout@v4
      - name: Données privées
        uses: actions/checkout@v4
        with:
          repository: 84dr55wgm2-eng/squabot
          token: ${{ secrets.SQUABOT_TOKEN }}
          path: donnees
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
          cache: pip
      - name: Outils
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          pip install -r requirements.txt
      - name: Voix VoxCPM2 en cache
        uses: actions/cache@v4
        with:
          path: /tmp/vox
          key: vox-${{ hashFiles('squabot/vox.py') }}-v1
          restore-keys: vox-
      - name: Voix VoxCPM2 (Python 3.12 à part)
        run: |
          if [ ! -x /tmp/vox/bin/python ]; then
            python3.12 -m venv /tmp/vox
            /tmp/vox/bin/pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            /tmp/vox/bin/pip install -q "voxcpm @ git+https://github.com/OpenBMB/VoxCPM" soundfile numpy
          fi
          echo "SQUABOT_VOX_PYTHON=/tmp/vox/bin/python" >> "$GITHUB_ENV"
      - name: Modèles en cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/squabot
            ~/.cache/huggingface
          key: modeles-v2
      - name: Voix et images déjà faites
        uses: actions/cache@v4
        with:
          path: donnees/data/videos/${{ matrix.id }}/cache
          key: cache-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: cache-${{ matrix.id }}-
      - name: Fabrication
        env:
          GH_TOKEN: ${{ secrets.SQUABOT_TOKEN }}
          GH_REPO: 84dr55wgm2-eng/squabot
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          ID: ${{ matrix.id }}
        run: |
          dossier="donnees/data/videos/$ID"
          st=$(python -c "import json;print(json.load(open('$dossier/video.json')).get('statut'))")
          [ "$st" != "a_fabriquer" ] && { echo "Déjà faite ($st)"; exit 0; }
          python -m squabot fabriquer "$dossier"
          ffmpeg -nostdin -loglevel error -y -i "$dossier/video.mp4" -vf scale=720:1280 -c:v libx264 -crf 26 -preset slow \
            -c:a aac -b:a 128k -movflags +faststart "$dossier/apercu.mp4"
          gh release create "$ID" --title "$ID" --notes "Vidéo fabriquée par squabot" --prerelease \
            "$dossier/video.mp4" "$dossier/miniature.jpg" 2>/dev/null \
            || gh release upload "$ID" "$dossier/video.mp4" "$dossier/miniature.jpg" --clobber
      - name: Enregistrer dans les données privées
        env: {ID: "${{ matrix.id }}"}
        run: |
          cd donnees
          git config user.name squabot && git config user.email squabot@users.noreply.github.com
          printf 'data/videos/*/video.mp4\ndata/videos/*/*.wav\ndata/videos/*/cache/\n' >> .git/info/exclude
          git add -A "data/videos/$ID"
          git diff --cached --quiet && exit 0
          git commit -m "Vidéo fabriquée : $ID [skip ci]"
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 7)); done
          exit 1
  publier:
    needs: fabriquer
    if: always() && needs.fabriquer.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run publier.yml --repo ${{ github.repository }}
